<!DOCTYPE html>

<meta name="description" content="缪萨克斯集市 Musarches Fair — 忒拉蓬出品。缪斯的语言工具集市：时之砂刻、Hunter Quest 猎语征途、星空梦想乡，一起让语言像追剧一样上瘾。" />

<!-- ⚡ 同步 SW 清理 + 两阶段自救方案 -->
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller;
  var firstTry = !location.search.includes('swcleaned=1');

  // 1. 立刻 unregister 所有 SW
  navigator.serviceWorker.getRegistrations().forEach(function(r) { r.unregister(); });
  // 2. 清所有 Cache Storage
  try { caches.keys().then(function(keys) { keys.forEach(function(k){ caches.delete(k); }); }); } catch(e) {}

  // 3. 如果有旧 SW 在控制 且 还没清过 → 刷新一次让新页面不受拦截
  if (hadController && firstTry) {
    console.log('🧹 发现旧 SW 在控制，刷新一次...');
    // 不要 location.reload() —— 旧 SW 还会拦截
    // 用全新 URL 彻底绕过
    setTimeout(function(){
      location.replace(location.pathname + '?swcleaned=1&t=' + Date.now());
    }, 100);
  }
})();
</script>

<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/win98.css" />
</head>
<body>
  <div id="app">
    <!-- 默认 boot 占位 —— 由 app.js 在 win98 模式下替换成 Win98 开机画面 -->
    <div class="boot"></div>

  <!-- Win98 开机画面（由 app.js 在 win98 模式下激活） -->
  <div id="w98-boot" class="boot" style="display:none">

    <div class="w98-boot-msg">正在加载缪斯的语言组件…</div>
  </div>

  <!-- Win98 任务栏 + 开始菜单（由 app.js 在 win98 模式下注入到 body） -->
  <div id="modal" class="modal-host" hidden></div>
  <div id="toast" class="toast-host" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
