<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>缪萨克斯集市 Musarches Fair · 缪斯的语言集市</title>
<meta name="description" content="缪萨克斯集市 Musarches Fair — 忒拉蓬出品。缪斯的语言工具集市：时之砂刻、Hunter Quest 猎语征途、星空梦想乡，一起让语言像追剧一样上瘾。" />
<meta name="theme-color" content="#000080" />
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="icon" href="/assets/icon-96.png" type="image/png" />

<!-- ⚡ 同步 SW 清理（正确 Promise 写法）-->
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller;
  var isRetry = location.search.indexOf('swcleaned=') !== -1;

  Promise.resolve(navigator.serviceWorker.getRegistrations())
    .then(function(regs) {
      if (regs && regs.length) {
        regs.forEach(function(r) { try { r.unregister(); } catch(e){} });
        console.log('🧹 已 unregister', regs.length, '个旧 SW');
      }
    })
    .catch(function(e) { console.warn('SW 清理出错:', e); });

  Promise.resolve(caches && caches.keys && caches.keys())
    .then(function(keys) {
      if (keys && keys.length) {
        keys.forEach(function(k) { try { caches.delete(k); } catch(e){} });
        console.log('🧹 已清', keys.length, '个旧缓存');
      }
    })
    .catch(function(e) { /* ignore */ });

  // 旧 SW 在控制 + 第一次 → 刷新让新页面不受拦截
  if (hadController && !isRetry) {
    console.log('🔄 旧 SW 在控制，150ms 后刷新...');
    setTimeout(function() {
      location.replace(location.pathname + '?swcleaned=1&t=' + Date.now());
    }, 150);
  }
})();
</script>

<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/win98.css" />
</head>
<body>
  <div id="app">
    <!-- 默认 boot 占位 —— 由 app.js 在 win98 模式下替换成 Win98 开机画面 -->
    <div class="boot"></div>
  </div>

  <!-- Win98 开机画面（由 app.js 在 win98 模式下激活） -->
  <div id="w98-boot" class="boot" style="display:none">
    <div class="w98-boot-logo"><span class="l1"></span><span class="l2"></span></div>
    <div class="w98-boot-title">缪萨克斯集市</div>
    <div class="w98-boot-subtitle">Windows 98 · Musarches Fair Edition</div>
    <div class="w98-boot-progress"><div class="w98-boot-progress-inner"></div></div>
    <div class="w98-boot-msg">正在加载缪斯的语言组件…</div>
  </div>

  <!-- Win98 任务栏 + 开始菜单（由 app.js 在 win98 模式下注入到 body） -->
  <div id="modal" class="modal-host" hidden></div>
  <div id="toast" class="toast-host" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
