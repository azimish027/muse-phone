<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- 羊皮纸底 -->
  <rect width="640" height="360" fill="#F5EFE6"/>
  <!-- 右下粉紫渐变三角（山/剪影） -->
  <path d="M 400 360 L 640 200 L 640 360 Z" fill="#9B7B9F" fill-opacity="0.18"/>
  <path d="M 480 360 L 640 270 L 640 360 Z" fill="#C45A3B" fill-opacity="0.12"/>
  
  <!-- 斜射的金箭头 -->
  <g transform="translate(300,200) rotate(-35)">
    <!-- 箭杆 -->
    <line x1="-120" y1="0" x2="100" y2="0" stroke="#C45A3B" stroke-width="5" stroke-linecap="round"/>
    <!-- 箭头 -->
    <path d="M 100 0 L 80 -14 L 80 14 Z" fill="#C45A3B"/>
    <!-- 箭尾羽毛 -->
    <path d="M -120 0 L -135 -12 L -125 0 L -135 12 Z" fill="#D4A24A"/>
    <!-- 飘着的英语气泡 -->
    <g font-family="Georgia, serif" fill="#5D5D5D" font-size="12" font-weight="600">
      <circle cx="-30" cy="-22" r="18" fill="#F5EFE6" stroke="#9B7B9F" stroke-width="1.5"/>
      <text x="-30" y="-18" text-anchor="middle">Hello</text>
      <circle cx="30" cy="-35" r="22" fill="#F5EFE6" stroke="#C45A3B" stroke-width="1.5"/>
      <text x="30" y="-31" text-anchor="middle">Quest!</text>
      <circle cx="0" cy="-50" r="16" fill="#D4A24A" fill-opacity="0.25" stroke="#D4A24A" stroke-width="1.5"/>
      <text x="0" y="-46" text-anchor="middle" fill="#8B6914">XP+</text>
    </g>
  </g>
  
  <!-- 小日轮水印 -->
  <g transform="translate(570,60)" opacity="0.35">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C45A3B" stroke-width="2.5"/>
    <g stroke="#C45A3B" stroke-width="2.5" stroke-linecap="butt">
      <line x1="0" y1="-28" x2="0" y2="-20"/>
      <line x1="0" y1="20" x2="0" y2="28"/>
      <line x1="-28" y1="0" x2="-20" y2="0"/>
      <line x1="20" y1="0" x2="28" y2="0"/>
    </g>
  </g>
  
  <!-- 文字 -->
  <text x="30" y="330" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#5D5D5D" letter-spacing="2">Hunter Quest</text>
  <text x="30" y="348" font-family="Georgia, serif" font-size="13" fill="#9B7B9F" letter-spacing="5">猎 语 征 途</text>
</svg>
