<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- 羊皮纸底 -->
  <rect width="640" height="360" fill="#F5EFE6"/>
  <!-- 旧笔记本横线 -->
  <g stroke="#E0D8C8" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
  </g>
  
  <!-- 几何沙漏（方形外框，昭和橘红） -->
  <g transform="translate(320,180)">
    <!-- 外框 -->
    <rect x="-70" y="-90" width="140" height="180" fill="none" stroke="#C45A3B" stroke-width="6" rx="4"/>
    <!-- 上三角（空的，暗示时间流走） -->
    <path d="M -55 -75 L 0 -15 L 55 -75 Z" fill="none" stroke="#9B7B9F" stroke-width="3"/>
    <!-- 下三角（填充，已经落下来的砂） -->
    <path d="M -55 75 L 0 15 L 55 75 Z" fill="#9B7B9F" fill-opacity="0.25" stroke="#9B7B9F" stroke-width="3"/>
    <!-- 中间连接点（橘红） -->
    <circle cx="0" cy="0" r="5" fill="#C45A3B"/>
    <!-- 落下的砂粒（小圆点） -->
    <g fill="#D4A24A">
      <circle cx="-3" cy="10" r="1.5"/>
      <circle cx="2" cy="18" r="1.2"/>
      <circle cx="-1" cy="26" r="1"/>
      <circle cx="1" cy="34" r="1.2"/>
    </g>
  </g>
  
  <!-- 小日轮水印 -->
  <g transform="translate(570,60)" opacity="0.35">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C45A3B" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#9B7B9F" stroke-width="1.5"/>
    <g stroke="#C45A3B" stroke-width="2.5" stroke-linecap="butt">
      <line x1="0" y1="-28" x2="0" y2="-20"/>
      <line x1="0" y1="20" x2="0" y2="28"/>
      <line x1="-28" y1="0" x2="-20" y2="0"/>
      <line x1="20" y1="0" x2="28" y2="0"/>
    </g>
  </g>
  
  <!-- 文字 -->
  <text x="30" y="330" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#5D5D5D" letter-spacing="3">时 之 砂 刻</text>
  <text x="30" y="348" font-family="Georgia, serif" font-size="11" fill="#9B7B9F" letter-spacing="4" text-transform="uppercase">sand · chron</text>
</svg>
