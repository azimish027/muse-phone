<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🔄 强制刷新 · 缪萨克斯</title>
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="refresh" content="0; url=./reset.html">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000080;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #c0c0c0;
    color: #000;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    padding: 20px;
    max-width: 400px;
    width: 100%;
  }
  .title-bar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    padding: 4px 8px;
    font-weight: bold;
    margin: -20px -20px 12px -20px;
    display: flex;
    justify-content: space-between;
  }
  h1 { font-size: 15px; margin: 4px 0 12px; }
  .pulse { font-size: 42px; text-align: center; margin: 8px 0;
    animation: pulse 0.8s infinite; }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:.5; transform:scale(1.15); }
  }
  .log {
    background: #000;
    color: #0f0;
    font-family: monospace;
    font-size: 11px;
    padding: 10px;
    border: 1px solid #808080;
    margin: 12px 0;
    min-height: 100px;
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.5;
  }
  .log .ok { color: #0f0; }
  .log .err { color: #f66; }
  .log .warn { color: #ff0; }
  .log .info { color: #8cf; }
  .countdown { font-size: 40px; font-weight: bold; color: #c00; text-align: center; margin: 8px; }
  .big-btn {
    display: block;
    width: 100%;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    color: #000;
    padding: 10px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
  }
  .big-btn:active { border-color: #000000 #ffffff #ffffff #000000; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="title-bar">
      <span>🔄 缪萨克斯 · 刷新工具</span>
    </div>

    <!-- 阶段 1：清理中 -->
    <div id="phase1">
      <h1>🧹 正在强制清除 Service Worker 缓存...</h1>
      <div class="pulse">⚡</div>
      <div class="log" id="log">⏳ 自动开始...</div>
    </div>

    <!-- 阶段 2：清理完成 -->
    <div id="phase2" class="hidden">
      <h1>✅ 清除完成！跳回首页</h1>
      <div class="pulse">🎉</div>
      <div class="countdown" id="cd">3</div>
    </div>

    <!-- 阶段 3：失败手动方案 -->
    <div id="phase3" class="hidden">
      <h1>⚠️ 需要手动清缓存</h1>
      <div class="log" id="log3"></div>
      <button class="big-btn" onclick="location.reload()">🔄 重试自动清除</button>
      <p style="font-size:11px;margin-top:12px;color:#444;">
        <b>Android Chrome:</b> 设置 → 应用 → 缪萨克斯 → 卸载<br>
        <b>iOS Safari:</b> 设置 → Safari → 高级 → 网站数据 → 删 github.io
      </p>
    </div>
  </div>

<script>
const logEl = document.getElementById('log');
function log(msg, type='') {
  const cls = type ? ` class="${type}"` : '';
  logEl.innerHTML += `<div${cls}>${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

async function doClear() {
  try {
    // 1. 找 SW
    log('① 查找 Service Worker 注册...', 'info');
    const regs = await navigator.serviceWorker.getRegistrations();
    log(`   找到 ${regs.length} 个 SW`, 'info');

    // 2. unregister 所有 SW
    let unreg = 0;
    for (const reg of regs) {
      const ok = await reg.unregister();
      if (ok) {
        unreg++;
        log(`   ✅ 注销: ${reg.scope}`, 'ok');
      } else {
        log(`   ⚠️ 注销失败: ${reg.scope}`, 'warn');
      }
    }
    if (regs.length === 0) log('   （没有 SW 注册）', 'info');
    else log(`   🧹 已注销 ${unreg} / ${regs.length}`, unreg === regs.length ? 'ok' : 'warn');

    // 3. 清 Cache Storage
    log('② 清除 Cache Storage...', 'info');
    const keys = await caches.keys();
    log(`   有 ${keys.length} 个缓存: ${keys.join(', ') || '(空)'}`, 'info');
    let del = 0;
    for (const k of keys) {
      await caches.delete(k);
      del++;
      log(`   ✅ 删: ${k}`, 'ok');
    }

    // 4. 清 Storage
    log('③ 清除 LocalStorage / SessionStorage / IndexedDB...', 'info');
    try { localStorage.clear(); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}
    try {
      const dbs = await indexedDB.databases();
      for (const db of dbs) {
        if (db.name) indexedDB.deleteDatabase(db.name);
      }
    } catch(e) {}
    log('   ✅ 全部清完', 'ok');

    // 5. 等一小下让 unregister 完成
    log(`\n🎉 清除完成！SW=${unreg}, Cache=${del}`, 'ok');
    log('⏳ 3 秒后跳回首页...', 'warn');

    // 切到 phase2
    document.getElementById('phase1').classList.add('hidden');
    document.getElementById('phase2').classList.remove('hidden');

    let cd = 3;
    const cdEl = document.getElementById('cd');
    const timer = setInterval(() => {
      cd--;
      cdEl.textContent = cd;
      if (cd <= 0) {
        clearInterval(timer);
        // 用时间戳强制绕过所有缓存
        const ts = Date.now();
        window.location.replace('./?v=' + ts);
      }
    }, 1000);

  } catch (err) {
    log(`❌ 出错: ${err.message}`, 'err');
    document.getElementById('phase1').classList.add('hidden');
    document.getElementById('phase3').classList.remove('hidden');
  }
}

// 页面一加载 100ms 后自动开始
window.addEventListener('load', () => {
  setTimeout(doClear, 100);
});
</script>
</body>
</html>
