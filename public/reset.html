<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🔄 强制刷新 · 缪萨克斯</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000080;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #c0c0c0;
    color: #000;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .title-bar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: white;
    padding: 4px 8px;
    font-weight: bold;
    margin: -24px -24px 16px -24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .title-bar .x {
    background: #c0c0c0;
    color: #000;
    border: 1px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    padding: 0 6px;
    font-weight: bold;
    cursor: default;
  }
  h1 { font-size: 16px; margin: 8px 0 16px; }
  .pulse {
    font-size: 48px;
    margin: 12px 0;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.1); }
  }
  .log {
    background: #000;
    color: #0f0;
    font-family: "Courier New", monospace;
    font-size: 12px;
    text-align: left;
    padding: 12px;
    border: 1px solid #808080;
    margin: 16px 0;
    min-height: 120px;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.6;
  }
  .log .ok { color: #0f0; }
  .log .err { color: #f66; }
  .log .warn { color: #ff0; }
  button {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #000000 #000000 #ffffff;
    color: #000;
    padding: 8px 24px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    margin: 8px 4px;
  }
  button:active {
    border-color: #000000 #ffffff #ffffff #000000;
  }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  .countdown {
    font-size: 32px;
    font-weight: bold;
    color: #c00;
    margin: 12px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title-bar">
      <span>🔄 缪萨克斯 · 强制刷新工具</span>
      <span class="x">×</span>
    </div>

    <div id="phase1">
      <h1>🧹 强制清除 Service Worker 缓存</h1>
      <div class="pulse">🚀</div>
      <div class="log" id="log">⏳ 准备中...</div>
      <button id="btn" onclick="start()">⚡ 立刻清缓存 + 刷新</button>
      <p style="font-size:12px; color:#444; margin-top:12px;">
        不管旧 SW 多顽固，这个页面会 100% 干掉它。
      </p>
    </div>

    <div id="phase2" style="display:none">
      <h1>✅ 搞定！正在跳回首页</h1>
      <div class="pulse">🎉</div>
      <div class="countdown" id="cd">3</div>
      <p>SW 已清除，缓存已清空，即将重新注册新版 SW。</p>
      <p style="font-size:12px; color:#444; margin-top:12px;">
        如果没自动跳转，<a href="./">点这里手动返回首页</a>
      </p>
    </div>
  </div>

<script>
const logEl = document.getElementById('log');
function log(msg, type='') {
  const cls = type ? ` class="${type}"` : '';
  logEl.innerHTML += `<div${cls}>${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

async function start() {
  document.getElementById('btn').disabled = true;
  log('🚀 开始强制清除流程...', 'warn');

  // 1. Unregister 所有 SW
  log('① 查找已注册的 Service Worker...');
  let swCount = 0;
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    log(`   找到 ${regs.length} 个 SW 注册`);
    for (const reg of regs) {
      await reg.unregister();
      swCount++;
      log(`   ✅ 已 unregister: ${reg.scope}`, 'ok');
    }
  } catch (e) {
    log(`   ⚠️ getRegistrations 失败: ${e.message}`, 'warn');
  }

  // 2. 清所有 Cache Storage
  log('② 清除 Cache Storage...');
  try {
    const keys = await caches.keys();
    log(`   找到 ${keys.length} 个缓存: ${keys.join(', ') || '(空)'}`);
    for (const k of keys) {
      await caches.delete(k);
      log(`   ✅ 已删除: ${k}`, 'ok');
    }
  } catch (e) {
    log(`   ⚠️ Cache API 失败: ${e.message}`, 'warn');
  }

  // 3. 清 localStorage / sessionStorage
  log('③ 清除 LocalStorage...');
  try {
    const lsKeys = Object.keys(localStorage);
    localStorage.clear();
    sessionStorage.clear();
    log(`   ✅ 已清 ${lsKeys.length} 项`, 'ok');
  } catch (e) {
    log(`   ⚠️ LocalStorage 失败: ${e.message}`, 'warn');
  }

  // 4. 清 IndexedDB
  log('④ 清除 IndexedDB...');
  try {
    const dbs = await indexedDB.databases();
    for (const db of dbs) {
      if (db.name) {
        indexedDB.deleteDatabase(db.name);
        log(`   ✅ 已删除 DB: ${db.name}`, 'ok');
      }
    }
  } catch (e) {
    log(`   ⚠️ IndexedDB 失败: ${e.message}`, 'warn');
  }

  // 5. 跳转到 phase2，5 秒后跳首页
  log(`\n🎉 SW=${swCount} 个注销, 缓存全清！`, 'ok');
  log('⏳ 3 秒后跳回首页...', 'warn');

  document.getElementById('phase1').style.display = 'none';
  document.getElementById('phase2').style.display = 'block';

  let cd = 3;
  const cdEl = document.getElementById('cd');
  const timer = setInterval(() => {
    cd--;
    cdEl.textContent = cd;
    if (cd <= 0) {
      clearInterval(timer);
      // 带 t 参数绕过浏览器缓存
      window.location.href = './?reset=' + Date.now();
    }
  }, 1000);
}
</script>
</body>
</html>
