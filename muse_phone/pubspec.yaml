name: muse_phone
description: Musē Phōnē — 语缪 · 忒拉蓬 Therapōn Musarches
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # SQLite 本地存储（单机核心）
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # WebView（嵌套 RPG / Mind 子应用）
  webview_flutter: ^4.8.0
  # 状态管理（轻量 ValueNotifier + ChangeNotifier，不用 Riverpod）
  provider: ^6.1.2
  # UI 增强
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  # 本地通知（时间管理用）
  flutter_local_notifications: ^17.2.4
  # 日期格式化
  intl: ^0.19.0
  # 音频（时间管理滴答声 / 冥想音）
  just_audio: ^0.9.40
  # 持久化偏好
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seeds/
    - assets/webviews/rpg/
    - assets/webviews/rpg/assets/
    - assets/webviews/mind/
    - assets/webviews/mind/assets/
    - assets/images/
