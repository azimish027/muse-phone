<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>🌀 黑洞涡旋 3 方案对比</title>
<style>
  body { background: #2B2B2B; color: #F5EFE6; font-family: -apple-system, Georgia, serif; padding: 40px 20px; margin: 0; }
  h1 { text-align: center; font-size: 32px; margin-bottom: 8px; }
  .sub { text-align: center; color: #9B7B9F; margin-bottom: 48px; letter-spacing: 4px; }
  .row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .card { background: #1a1a1a; border: 2px solid #C45A3B; padding: 24px; max-width: 420px; text-align: center; }
  .card svg, .card img { width: 100%; height: auto; background: #F5EFE6; border-radius: 0; display: block; }
  .card h2 { margin: 20px 0 8px; color: #D4A24A; font-size: 18px; }
  .card p { color: #B0A295; font-size: 13px; line-height: 1.6; }
  .hint { text-align: center; margin-top: 48px; color: #9B7B9F; font-size: 14px; }
</style></head>
<body>
  <h1>🌀 黑洞涡旋 · 3 个方案对比</h1>
  <div class="sub">太阳神的后花园 —— 深渊版</div>
  <div class="row">
    <div class="card">
      <img src="assets/brand/vortex-spiral.svg" />
      <h2>① 贝壳/蜗牛壳 对数螺旋</h2>
      <p>自然生长感的阿基米德螺旋线，旋转 3.5 圈。粉紫 + 日轮红双螺旋臂，中心金点。像深海贝壳里藏着太阳。</p>
    </div>
    <div class="card">
      <img src="assets/brand/vortex-deep.svg" />
      <h2>② 蚊香紧密螺旋 深渊</h2>
      <p>5 层同心圆环从粉紫渐深到暗棕黑，配三条旋转暗示弧。中心是真正的黑洞吸积盘。深渊感最强，看久了晕。</p>
    </div>
    <div class="card">
      <img src="assets/brand/vortex-blackhole.svg" />
      <h2>③ 黑洞涡旋 吸积盘</h2>
      <p>双层椭圆吸积盘 + 四条螺旋旋臂 + 事件视界黑洞。像太阳突然坍缩成黑洞，8 根日轮射线还在，中心已经是深渊。最有故事感。</p>
    </div>
  </div>
  <div class="hint">🌙 三个都保留了：8 射线日轮 + 外圆 + 底部缪萨克斯集市 / 太阳神的后花园 / azimish</div>
</body></html>
