# ============================
# 语缪 Musē Phōnē · Docker Compose
# ============================
# 用途：一键起 app + nginx(反代+HTTPS) + 自动申请证书
#
# 使用：
#   1. 改 .env.production 里的 DOMAIN / CORS_ORIGINS
#   2. cp .env.production .env
#   3. docker compose up -d --build
#
# 证书自动续期（certbot + nginx），到期前 30 天自动续。
# SQLite 数据在 ./data/ 卷里，容器重启不丢。

services:

  # === 主应用（Node 22 alpine，零 npm 依赖）===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muse-phone-app
    restart: unless-stopped
    env_file: .env
    volumes:
      # 生产数据库持久化（覆盖容器内 /app/data）
      - ./data:/app/data
      # 证书目录（nginx 会把证书挂进来）
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    expose:
      - "5173"  # 只对 nginx 内部开放，不直接暴露
    networks:
      - muse-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 8s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # === Nginx（反代 + HTTPS + gzip 第二层 + SPA fallback）===
  nginx:
    image: nginx:1.27-alpine
    container_name: muse-phone-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - muse-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # === Certbot（首次启动申请证书 + 自动续期）===
  certbot:
    image: certbot/certbot
    container_name: muse-phone-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@example.com}
    entrypoint: >
      /bin/sh -c '
      if [ ! -d /etc/letsencrypt/live/${DOMAIN} ]; then
        echo ">>> 首次申请证书 for ${DOMAIN}";
        certbot certonly \
          --webroot \
          --webroot-path=/var/www/certbot \
          -d ${DOMAIN} \
          ${DOMAIN_ALT:+ -d ${DOMAIN_ALT}} \
          --non-interactive \
          --agree-tos \
          --email ${CERTBOT_EMAIL} \
          --keep-until-expiring;
      else
        echo ">>> 证书已存在：${DOMAIN}";
      fi;
      # 自动续期守护
      trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h & wait $${!};
      done;
      '

networks:
  muse-net:
    driver: bridge
