# ============================
# 语缪 Musē Phōnē · Nginx 配置
# ============================
# 功能：反代 app + HTTPS + gzip 第二层 + SPA fallback + 安全头 + 静态资源长缓存
#
# 流程：
#   HTTP :80 → certbot 申请证书 / → 301 到 HTTPS
#   HTTPS:443 → 反代到 app:5173
#   静态资源 (.html/js/css/svg/img) → 直接 nginx 读（如果挂载）
#   /api/* → 强制反代（Node 处理）
#   /* 其他 → 反代 + SPA fallback（app 已经处理了）

# --- HTTP 入口：certbot 验证 + 重定向 ---
server {
    listen 80 default_server;
    server_name _;

    # certbot webroot 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 其他全跳到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    server_name ${DOMAIN}; # docker compose 启动时 envsubst 替换
    ${DOMAIN_ALT:+server_name ${DOMAIN_ALT};}

    # === TLS（certbot 自动生成）===
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    # TLS 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS（浏览器强制 HTTPS，2 年）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # === gzip 第二层（Node 已经 gzip，nginx 作为保险）===
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml font/truetype image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # === 安全头 ===
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # === 反代到 Node app ===
    location / {
        proxy_pass http://app:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # === 健康检查（nginx 自己也能答，不依赖 Node）===
    location = /health {
        proxy_pass http://app:5173/health;
        access_log off;
    }

    # === /api/* 反代（和上面一样，但独立 location 方便未来加限流）===
    location /api/ {
        proxy_pass http://app:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # === iframe 子应用反代（明确 location，未来可单独加 header）===
    location ^~ /time/ { proxy_pass http://app:5173; }
    location ^~ /rpg/  { proxy_pass http://app:5173; }
    location ^~ /mind/ { proxy_pass http://app:5173; }

    # === 静态资源长缓存（Node 已经设了 Cache-Control，nginx 透传即可）===
    # 这里留空 — 让 Node 的响应头决定。如果未来把静态文件迁到 nginx 挂载，在这里加 try_files。

    # === 请求体大小（用户头像上传等）===
    client_max_body_size 10m;
}

# === 限流（可选，防止暴力破解）===
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
