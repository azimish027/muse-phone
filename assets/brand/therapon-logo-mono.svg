<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- ===== mono 版：纯黑白印刷，背景透明 ===== -->

  <!-- ===== 1. 8 根日轮射线 ===== -->
  <g stroke="#1a1a1a" stroke-width="12" stroke-linecap="butt">
    <line x1="300" y1="45"  x2="300" y2="90"/>
    <line x1="300" y1="510" x2="300" y2="555"/>
    <line x1="45"  y1="300" x2="90"  y2="300"/>
    <line x1="510" y1="300" x2="555" y2="300"/>
    <line x1="85"  y1="85"  x2="125" y2="125"/>
    <line x1="475" y1="475" x2="515" y2="515"/>
    <line x1="515" y1="85"  x2="475" y2="125"/>
    <line x1="125" y1="475" x2="85"  y2="515"/>
  </g>

  <!-- ===== 2. 粗外圆 r=180 ===== -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#1a1a1a" stroke-width="12"/>

  <!-- ===== 3. 紫环 stroke-width=7 ===== -->
  <circle cx="300" cy="300" r="162" fill="none" stroke="#1a1a1a" stroke-width="7"/>

  <!-- ===== 4. 金色椭圆 stroke-width=3.5 ===== -->
  <ellipse cx="300" cy="300" rx="132" ry="44" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>

  <!-- ===== 5. 同心圆吸积盘 r=95, 80, 52, 28(粗) ===== -->
  <circle cx="300" cy="300" r="95" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="300" cy="300" r="80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="300" cy="300" r="52" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="300" cy="300" r="28" fill="none" stroke="#1a1a1a" stroke-width="5"/>

  <!-- ===== 6. 中心黑洞 r=24 ===== -->
  <circle cx="300" cy="300" r="24" fill="#1a1a1a"/>

  <!-- ===== 7. r=18 内装饰环 ===== -->
  <circle cx="300" cy="300" r="18" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="9"  fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="300" cy="300" r="3"  fill="#FFFFFF"/>

  <!-- ===== 8. 四角邮戳点 ===== -->
  <g fill="#1a1a1a">
    <circle cx="50"  cy="50"  r="6"/>
    <circle cx="550" cy="50"  r="6"/>
    <circle cx="50"  cy="550" r="6"/>
    <circle cx="550" cy="550" r="6"/>
  </g>

  <!-- ===== 9. 底部文字 ===== -->
  <text x="300" y="448" text-anchor="middle"
        font-family="Georgia, 'Noto Serif SC', 'Hiragino Sans GB', 'Songti SC', serif"
        font-size="46" font-weight="700" fill="#1a1a1a" letter-spacing="6">忒拉蓬</text>
  <text x="300" y="484" text-anchor="middle"
        font-family="Georgia, serif" font-size="22" font-style="italic"
        fill="#1a1a1a" letter-spacing="9">Therapōn</text>
  <text x="300" y="520" text-anchor="middle"
        font-family="'Hiragino Sans GB', 'Noto Sans SC', Georgia, serif" font-size="14"
        fill="#1a1a1a" letter-spacing="7">☀ 太 阳 神 的 后 花 园 ☀</text>
  <text x="540" y="560" text-anchor="end"
        font-family="Georgia, serif" font-size="13" font-style="italic"
        fill="#1a1a1a" letter-spacing="3">— azimish</text>
</svg>
