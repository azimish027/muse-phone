<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- 羊皮纸底色 -->
  <rect width="600" height="600" fill="#F5EFE6"/>
  
  <!-- 8根日轮射线 -->
  <g stroke="#C45A3B" stroke-width="12" stroke-linecap="butt">
    <line x1="300" y1="60" x2="300" y2="95"/>
    <line x1="300" y1="505" x2="300" y2="540"/>
    <line x1="60" y1="300" x2="95" y2="300"/>
    <line x1="505" y1="300" x2="540" y2="300"/>
    <line x1="100" y1="100" x2="125" y2="125"/>
    <line x1="475" y1="475" x2="500" y2="500"/>
    <line x1="500" y1="100" x2="475" y2="125"/>
    <line x1="125" y1="475" x2="100" y2="500"/>
  </g>
  
  <!-- 外圆（日轮） -->
  <circle cx="300" cy="300" r="175" fill="none" stroke="#C45A3B" stroke-width="10"/>
  
  <!-- 内圆（粉紫） -->
  <circle cx="300" cy="300" r="120" fill="none" stroke="#9B7B9F" stroke-width="4"/>
  
  <!-- 说话口型 + 中心小点（φōnē 保留） -->
  <path d="M 240 280 Q 300 320 360 280" fill="none" stroke="#C45A3B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 240 320 Q 300 280 360 320" fill="none" stroke="#9B7B9F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="6" fill="#D4A24A"/>
  
  <!-- 底部文字：三段式 -->
  <!-- 主品牌名：缪萨克斯集市 Musarches（衬线，居中，最大） -->
  <text x="300" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#2B2B2B" letter-spacing="3">缪萨克斯集市</text>
  <text x="300" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#7A5A6E" letter-spacing="4">Musarches</text>
  
  <!-- tagline：太阳神的后花园（紫粉，斜体，居中） -->
  <text x="300" y="510" text-anchor="middle" font-family="'Hiragino Sans GB', 'PingFang SC', Georgia, serif" font-size="13" fill="#9B7B9F" letter-spacing="6">☀ 太 阳 神 的 后 花 园 ☀</text>
  
  <!-- 个人名：azimish（最小，右下角，低调） -->
  <text x="540" y="555" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#B0A295" letter-spacing="3" font-style="italic">— azimish</text>
  
  <!-- 邮戳感：四角小圆点 -->
  <g fill="#C45A3B">
    <circle cx="50" cy="50" r="6"/>
    <circle cx="550" cy="50" r="6"/>
    <circle cx="50" cy="550" r="6"/>
    <circle cx="550" cy="550" r="6"/>
  </g>
</svg>
